
name: Update WICKEDCEO README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project archive
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const username = "wickedceo";

            const { data: repos } =
              await github.rest.repos.listForUser({
                username,
                per_page: 100,
                sort: "updated"
              });

            const projects = repos
              .filter(repo => !repo.fork && !repo.archived)
              .slice(0, 6);

            const content = projects.length
              ? projects.map(repo => {
                  const description = repo.description
                    ? " — " + repo.description
                        .replace(/\r?\n/g, " ")
                        .slice(0, 140)
                    : "";

                  return [
                    `- [**${repo.name}**](${repo.html_url})${description}`,
                    `  \`${repo.language || "Software"}\` · Updated ${repo.updated_at.slice(0, 10)}`
                  ].join("\n");
                }).join("\n\n")
              : "No public projects found yet.";

            const readme = fs.readFileSync("README.md", "utf8");

            const updated = readme.replace(
              /<!-- PROJECTS:START -->[\s\S]*?<!-- PROJECTS:END -->/,
              `<!-- PROJECTS:START -->\n${content}\n\n[Explore all projects →](https://github.com/${username}?tab=repositories)\n<!-- PROJECTS:END -->`
            );

            if (updated === readme) {
              core.info("No README changes detected.");
            } else {
              fs.writeFileSync("README.md", updated);
              core.info("Project archive updated.");
            }

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (
            git commit -m "chore: update project archive" &&
            git push
          )
